name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Test core
        run: swift test --package-path Packages/MultiCredCore

      - name: Build app (Release, unsigned)
        run: |
          xcodebuild -project MultiCred.xcodeproj -scheme MultiCred -configuration Release \
            -derivedDataPath build/ci build

      - name: Verify hardened runtime
        run: |
          APP=build/ci/Build/Products/Release/MultiCred.app
          codesign --force --deep --options runtime --sign - "$APP"
          codesign --verify --strict "$APP"
          codesign -d --verbose=2 "$APP" 2>&1 | grep -q "flags=.*runtime"

  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The app's runtime (GTK 4 / libadwaita 1.5 / libsecret from the distro, as in the .deb's
      # Depends) plus what the tests use: a private Xvfb display and D-Bus, a throwaway
      # gnome-keyring, ImageMagick for screenshots, and the packaging and validation tools.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi python3-gi-cairo python3-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-secret-1 gir1.2-rsvg-2.0 \
            xvfb xauth dbus gnome-keyring imagemagick \
            dpkg-dev fakeroot desktop-file-utils appstream git util-linux

      # Display, D-Bus and keyring tests skip themselves here.
      - name: Test (no display)
        working-directory: linux
        run: python3 -m unittest discover -s tests -t .

      # Everything, on a private Xvfb display and a bare D-Bus daemon (UI, tray, keyring, packaged app).
      - name: Test (private display and D-Bus)
        working-directory: linux
        run: tests/run-ui-tests.sh

      - name: Build .deb
        working-directory: linux
        run: packaging/build-deb.sh "$RUNNER_TEMP/dist"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: multicred-linux-deb
          path: ${{ runner.temp }}/dist/*.deb
          if-no-files-found: error
